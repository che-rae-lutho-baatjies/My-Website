<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Wear| Enquiry</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="navbar">

            <div class="logo">
                Elite Wear
            </div>

            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="services.html">Services</a>
                <a class="active" href="enquiry.html">Enquiry</a>
                <a href="contact.html">Contact</a>

            </nav>

        </div>

    </header>

    <section class="container">
        <div class="section-title">

            <h2>
                Customer Enquiry
            </h2>

            <p>
                Complete the form and we will receive your enquiry.

            </p>

        </div>

        <form class="form"
        onsubmit="submitEnquiry(event)">

        <div class="form-group">

            <label for="name">
                Full Name
            </label>

           <input

           id="name"
           name="name"
           type="text"
           placeholder="Enter your full name"
           required>

        </div>

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
            id="email"
            name="email"
            type="email"
            placeholder="Enter your email"
            required>

        </div>

        <div class="form-group">

            <label for="category">
                Product Category
            </label>

            <select
            id="category"
            name="category"
            required>

            <option value="">
                Choose a category
            </option>

            <option value="Dresses">
                Dresses
            </option>

            <option value="Shirts">
                Shirts
            </option>

            <option value="Shoes">
                Shoes
            </option>

            <option value="Pants">
                Pants
            </option>

            <option value="Other">
                Other

            </option>
        </select>

        </div>

        <div class="form-group">

            <label for="message">
                Your Enquiry
            </label>

            <textarea
            id="message"
            name="message"
            placeholder="Type your enquiry here..."
            required>
        </textarea>

        </div>

        <button
        class="btn"
        type="submit">

        Submit Enquiry
    
    </button>

    <p id="response"><</p>

    
    </form>

    </section>

    <footer>
    
    <p>
        Elite Wear| 76 Durban Street, Port Elizabeth | 0866724895

    </p>

    <p>
        %copy; 2026 Elite Wear

    </p>

    </footer>

    <script>
        function submitEnquiry(event) {

            event.preventDefault();

            document.getElementById("response").textContent = "Thank you! Your enquiry has been received.";
            event.target.reset();
        }
    </script>
</body>
</html>
